# Home Assistant-omgeving voor een (Linux) mini-pc.
#
# Standaard start alleen Home Assistant + Mosquitto:
#   docker compose up -d
#
# Met Zigbee2MQTT (Zigbee-stick nodig, zie .env):
#   docker compose --profile zigbee up -d
#
# Met ESPHome:
#   docker compose --profile esphome up -d

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.11.2
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro # Bluetooth
    environment:
      - TZ=${TZ:-Europe/Amsterdam}
    privileged: true
    network_mode: host # nodig voor automatische apparaatdetectie (mDNS/SSDP)
    restart: unless-stopped

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2.0.23
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    environment:
      - TZ=${TZ:-Europe/Amsterdam}
    ports:
      - "1883:1883"
    restart: unless-stopped

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:2.14.3
    profiles: ["zigbee"]
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - ${ZIGBEE_DEVICE:-/dev/ttyACM0}:/dev/ttyACM0
    environment:
      - TZ=${TZ:-Europe/Amsterdam}
      - ZIGBEE2MQTT_CONFIG_MQTT_SERVER=mqtt://mosquitto:1883
      - ZIGBEE2MQTT_CONFIG_MQTT_USER=${MQTT_USER}
      - ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD=${MQTT_PASSWORD}
      - ZIGBEE2MQTT_CONFIG_SERIAL_PORT=/dev/ttyACM0
      - ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER=${ZIGBEE_ADAPTER:-zstack}
    ports:
      - "8080:8080"
    depends_on:
      - mosquitto
    restart: unless-stopped

  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:2026.11.0
    profiles: ["esphome"]
    volumes:
      - ./esphome/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Europe/Amsterdam}
    network_mode: host # dashboard op poort 6052
    restart: unless-stopped

  # Matter Server (matter.js; de opvolger van python-matter-server, dezelfde server als de
  # add-on in Home Assistant OS). De integratie "Matter" verbindt met ws://localhost:5580/ws.
  # Vereist host-netwerk met IPv6 en multicast: werkt op de mini-pc (Linux), NIET via
  # Docker Desktop op de Mac. Starten: docker compose --profile matter up -d matter-server
  matter-server:
    container_name: matter-server
    image: ghcr.io/matter-js/matterjs-server:1.6.0
    profiles: ["matter"]
    volumes:
      - ./matter/data:/data
    environment:
      - TZ=${TZ:-Europe/Amsterdam}
    network_mode: host # Matter gebruikt mDNS en IPv6 op het thuisnetwerk
    restart: unless-stopped
