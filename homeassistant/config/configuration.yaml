# Basisconfiguratie van Home Assistant.
# De meeste integraties stel je in via de webinterface (Instellingen > Apparaten & diensten).

homeassistant:
  # Losse onderdelen per onderwerp in homeassistant/config/packages/
  packages: !include_dir_named packages

default_config:

# Thema's uit de Marketplace (homeassistant/config/themes/, niet in git).
# Kiezen per gebruiker/apparaat via je profiel > Thema.
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Dashboards die als YAML in git staan (homeassistant/config/dashboards/).
lovelace:
  dashboards:
    dashboard-overzicht:
      mode: yaml
      title: Overzicht
      icon: mdi:view-dashboard
      show_in_sidebar: true
      filename: dashboards/overzicht.yaml
    dashboard-deurbel:
      mode: yaml
      title: Deurbel
      icon: mdi:doorbell-video
      show_in_sidebar: true
      filename: dashboards/deurbel.yaml
    dashboard-deurbel-prive:
      mode: yaml
      title: Deurbel (privé)
      icon: mdi:doorbell-video
      show_in_sidebar: true
      require_admin: true # alleen beheerders; de weergave zelf alleen voor Stefan
      filename: dashboards/deurbel_prive.yaml
    dashboard-afstandsbediening:
      mode: yaml
      title: Afstandsbediening
      icon: mdi:remote-tv
      show_in_sidebar: true
      filename: dashboards/afstandsbediening.yaml
    dashboard-stofzuiger:
      mode: yaml
      title: Stofzuiger
      icon: mdi:robot-vacuum
      show_in_sidebar: true
      filename: dashboards/stofzuiger.yaml
    dashboard-verlichting:
      mode: yaml
      title: Verlichting
      icon: mdi:lightbulb-group
      show_in_sidebar: true
      filename: dashboards/verlichting.yaml
    dashboard-wasmachine:
      mode: yaml
      title: Wasmachine
      icon: mdi:washing-machine
      show_in_sidebar: true
      filename: dashboards/wasmachine.yaml

# Database opschonen: bewaar 30 dagen geschiedenis.
recorder:
  purge_keep_days: 30
