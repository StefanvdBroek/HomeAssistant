# Basisconfiguratie van Home Assistant.
# De meeste integraties stel je in via de webinterface (Instellingen > Apparaten & diensten).

homeassistant:
  # Losse onderdelen per onderwerp in homeassistant/config/packages/
  packages: !include_dir_named packages

default_config:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Dashboards die als YAML in git staan (homeassistant/config/dashboards/).
lovelace:
  dashboards:
    dashboard-afstandsbediening:
      mode: yaml
      title: Afstandsbediening
      icon: mdi:remote-tv
      show_in_sidebar: true
      filename: dashboards/afstandsbediening.yaml
    dashboard-stofzuiger:
      mode: yaml
      title: Stofzuiger
      icon: mdi:robot-vacuum
      show_in_sidebar: true
      filename: dashboards/stofzuiger.yaml

# Database opschonen: bewaar 30 dagen geschiedenis.
recorder:
  purge_keep_days: 30
