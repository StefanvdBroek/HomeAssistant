# Eufy-deurbel (via eufy-security-ws en de integratie "Eufy Security").
# Melding met beeld bij aanbellen, optioneel bij een persoon voor de deur,
# de lamp voordeur 's avonds even aan, en een waarschuwing bij een lege accu.

input_boolean:
  deurbel_melding_persoon:
    name: Melding bij persoon voor de deur
    icon: mdi:account-alert
  deurbel_live_altijd:
    name: Live beeld altijd aan
    icon: mdi:video-check
  deurbel_lamp_bij_aanbellen:
    name: Lamp voordeur aan bij aanbellen ('s avonds)
    icon: mdi:lightbulb-on

automation:
  # ------------------------------------------------------------- aanbellen
  - id: deurbel_aanbellen
    alias: Deurbel - melding bij aanbellen
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.deurbel_ringing
        from: "off"
        to: "on"
    actions:
      - delay: "00:00:02" # even wachten zodat de nieuwe snapshot er is
      - action: notify.mobile_app_iphone_van_stefan
        data:
          title: "🔔 Er wordt aangebeld"
          message: "Er staat iemand bij de voordeur ({{ now().strftime('%H:%M') }})."
          data:
            tag: deurbel
            # Alleen een foto: de deurbel (accu) heeft geen doorlopende stream, en met
            # entity_id: camera.* probeert de iPhone die te openen en toont dan niets.
            image: /api/camera_proxy/camera.deurbel
            url: /dashboard-overzicht/thuis
            push:
              interruption-level: time-sensitive
      - delay: "00:00:30" # niet opnieuw melden als iemand meerdere keren drukt

  # ------------------------------------------------- lamp aan bij aanbellen
  - id: deurbel_lamp_voordeur
    alias: Deurbel - lamp voordeur aan bij aanbellen in het donker
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.deurbel_ringing
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.deurbel_lamp_bij_aanbellen
        state: "on"
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: state
        entity_id: light.lamp_voordeur
        state: "off"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.lamp_voordeur
        data:
          brightness_pct: 100
          color_temp_kelvin: 4000
      - delay: "00:05:00"
      - action: light.turn_off
        target:
          entity_id: light.lamp_voordeur

  # ------------------------------------------------------ persoon voor de deur
  - id: deurbel_persoon
    alias: Deurbel - melding bij persoon voor de deur
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.deurbel_person_detected
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.deurbel_melding_persoon
        state: "on"
      - condition: state # aanbellen krijgt al een eigen melding
        entity_id: binary_sensor.deurbel_ringing
        state: "off"
    actions:
      - delay: "00:00:02"
      - action: notify.mobile_app_iphone_van_stefan
        data:
          title: "🚶 Iemand bij de voordeur"
          message: "De deurbel ziet een persoon ({{ now().strftime('%H:%M') }})."
          data:
            tag: deurbel
            # Alleen een foto: de deurbel (accu) heeft geen doorlopende stream, en met
            # entity_id: camera.* probeert de iPhone die te openen en toont dan niets.
            image: /api/camera_proxy/camera.deurbel
            url: /dashboard-overzicht/thuis
      - delay: "00:05:00" # hoogstens één melding per 5 minuten

  # ------------------------------------------------------- live beeld altijd
  # De deurbel hangt aan de stroom. Eufy beëindigt een live stream na een tijdje zelf;
  # dan start deze automatisering hem opnieuw (ook na een herstart van Home Assistant).
  - id: deurbel_live_altijd
    alias: Deurbel - live beeld altijd aan houden
    mode: queued # een stop tijdens een lopende start mag niet verloren gaan
    max: 3
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: camera.deurbel
        from: streaming
        for: "00:00:05"
      - trigger: state
        entity_id: input_boolean.deurbel_live_altijd
        to: "on"
      - trigger: homeassistant
        event: start
      - trigger: time_pattern # vangnet als een herstart een keer mislukt
        minutes: /1
    conditions:
      - condition: state
        entity_id: input_boolean.deurbel_live_altijd
        state: "on"
    actions:
      - delay: "00:00:05"
      # Pas hier controleren: in de wachtrij kan de stand intussen veranderd zijn.
      - condition: template
        value_template: >
          {{ is_state('input_boolean.deurbel_live_altijd', 'on')
             and not is_state('camera.deurbel', 'streaming') }}
      # Eerst netjes stoppen: de brug denkt soms dat de oude stream nog loopt
      # ("LivestreamAlreadyRunningError") en weigert dan een nieuwe start.
      - action: camera.turn_off
        target:
          entity_id: camera.deurbel
        continue_on_error: true
      - delay: "00:00:03"
      - action: camera.turn_on
        target:
          entity_id: camera.deurbel
        continue_on_error: true
      - delay: "00:00:15" # de deurbel even de tijd geven om te starten

  # ------------------------------------------------------------------- accu
  - id: deurbel_accu_laag
    alias: Deurbel - accu bijna leeg
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.deurbel_battery_percentage
        below: 20
    actions:
      - action: notify.mobile_app_iphone_van_stefan
        data:
          title: "🔋 Accu deurbel bijna leeg"
          message: "De deurbel heeft nog {{ states('sensor.deurbel_battery_percentage') }}%. Tijd om hem op te laden."
