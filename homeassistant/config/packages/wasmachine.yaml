# LG-wasmachine (LG ThinQ): meldingen, herinnering en sensoren voor het dashboard "Wasmachine".
#
# De machine kan niet doorgeven of de deur is opengegaan. Daarom houdt Home Assistant zelf bij
# of de was er nog in zit: aan zodra hij klaar is, uit via de knop "Was is eruit" in de melding
# of op het dashboard, of vanzelf zodra er een nieuwe wasbeurt start.

input_boolean:
  was_in_machine:
    name: Was zit nog in de machine
    icon: mdi:tshirt-crew

template:
  - sensor:
      - name: Wasmachine status
        unique_id: wasmachine_status_nl
        icon: mdi:washing-machine
        state: >
          {{ {
            'power_off': 'Uit', 'initial': 'Klaar om te starten', 'reserved': 'Uitgesteld gestart',
            'detecting': 'Lading wegen', 'running': 'Wassen', 'rinsing': 'Spoelen',
            'spinning': 'Centrifugeren', 'drying': 'Drogen', 'cool_down': 'Afkoelen',
            'rinse_hold': 'Spoelstop', 'steam_softening': 'Stomen', 'refreshing': 'Opfrissen',
            'pause': 'Gepauzeerd', 'end': 'Klaar', 'error': 'Fout', 'sleep': 'Slaapstand'
          }.get(states('sensor.wasmachine_current_status'), states('sensor.wasmachine_current_status')) }}
      - name: Wasmachine energie vandaag
        unique_id: wasmachine_energie_vandaag_kwh
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ (states('sensor.wasmachine_energy_today') | float(0) / 1000) | round(2) }}"
      - name: Wasmachine energie gisteren
        unique_id: wasmachine_energie_gisteren_kwh
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ (states('sensor.wasmachine_energy_yesterday') | float(0) / 1000) | round(2) }}"
      - name: Wasmachine energie deze maand
        unique_id: wasmachine_energie_deze_maand_kwh
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ (states('sensor.wasmachine_energy_this_month') | float(0) / 1000) | round(2) }}"
      - name: Wasmachine energie vorige maand
        unique_id: wasmachine_energie_vorige_maand_kwh
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ (states('sensor.wasmachine_energy_last_month') | float(0) / 1000) | round(2) }}"

automation:
  # ------------------------------------------------------------------ klaar
  # Primair via de gebeurtenis "washing_is_complete" van LG; als reserve via de status "end".
  # De voorwaarde voorkomt een dubbele melding als beide binnen 10 minuten binnenkomen.
  - id: wasmachine_klaar
    alias: Wasmachine - melding als hij klaar is
    mode: single
    triggers:
      - trigger: state
        entity_id: event.wasmachine_notification
        not_from:
          - unavailable
          - unknown
        id: lg_melding
      - trigger: state
        entity_id: sensor.wasmachine_current_status
        to: end
        not_from:
          - unavailable
          - unknown
        id: status
    conditions:
      - condition: template
        value_template: >
          {{ trigger.id != 'lg_melding'
             or trigger.to_state.attributes.event_type == 'washing_is_complete' }}
      - condition: template
        value_template: >
          {{ this.attributes.last_triggered is none
             or (now() - this.attributes.last_triggered).total_seconds() > 600 }}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.was_in_machine
      - action: notify.mobile_app_iphone_van_stefan
        data:
          title: "🧺 Wasmachine is klaar"
          message: "De was kan eruit. Hang hem op voordat hij gaat kreukelen of muf ruiken."
          data:
            tag: wasmachine
            push:
              interruption-level: time-sensitive
            actions:
              - action: WAS_ERUIT
                title: Was is eruit

  # -------------------------------------------------------------- herinnering
  - id: wasmachine_herinnering
    alias: Wasmachine - herinnering na een uur
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.was_in_machine
        to: "on"
        for: "01:00:00"
    actions:
      - action: notify.mobile_app_iphone_van_stefan
        data:
          title: "🧺 Zit de was er nog in?"
          message: "De wasmachine is al een uur klaar. Vergeet de was niet op te hangen."
          data:
            tag: wasmachine
            actions:
              - action: WAS_ERUIT
                title: Was is eruit

  # --------------------------------------------------- was eruit / nieuwe was
  - id: wasmachine_was_eruit
    alias: Wasmachine - was is eruit
    mode: single
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: WAS_ERUIT
      - trigger: state
        entity_id: sensor.wasmachine_current_status
        to:
          - detecting
          - running
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.was_in_machine

  # ------------------------------------------------------------------- fout
  - id: wasmachine_fout
    alias: Wasmachine - melding bij fout
    mode: queued
    variables:
      uitleg:
        unable_to_lock_error: "De deur kan niet op slot. Controleer of de deur goed dicht is."
        water_supply_error: "Er komt geen water binnen. Staat de kraan open en is de slang niet geknikt?"
        out_of_balance_error: "De trommel is uit balans. Verdeel de was en start opnieuw."
        door_open_error: "De deur staat open."
        water_drain_error: "Het water loopt niet weg. Controleer het pompfilter en de afvoerslang."
        overfill_error: "Er zit te veel water in de machine."
        water_level_sensor_error: "Storing in de waterniveausensor."
        power_fail_error: "De stroom is uitgevallen tijdens het wassen."
        locked_motor_error: "De motor zit vast."
        temperature_sensor_error: "Storing in de temperatuursensor."
        error_during_washing: "Er ging iets mis tijdens het wassen."
    triggers:
      - trigger: state
        entity_id: event.wasmachine_error
        not_from:
          - unavailable
          - unknown
      - trigger: state
        entity_id: event.wasmachine_notification
        not_from:
          - unavailable
          - unknown
    conditions:
      - condition: template
        value_template: >
          {{ trigger.to_state.attributes.event_type in uitleg }}
    actions:
      - action: notify.mobile_app_iphone_van_stefan
        data:
          title: "⚠️ Probleem met de wasmachine"
          message: "{{ uitleg[trigger.to_state.attributes.event_type] }}"
          data:
            push:
              interruption-level: time-sensitive
