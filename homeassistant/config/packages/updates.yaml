# Melding op de iPhone zodra er binnen Home Assistant een update beschikbaar komt:
# HACS-integraties en -kaarten, ESPHome-apparaten, Zigbee-firmware (via Zigbee2MQTT), enz.
#
# Updates van de Docker-images zelf (Home Assistant, Mosquitto, Zigbee2MQTT, ESPHome)
# komen als pull request van Dependabot op GitHub, zie .github/dependabot.yml.

automation:
  - id: melding_update_beschikbaar
    alias: Melding - update beschikbaar
    mode: queued
    max: 20
    triggers:
      - trigger: event
        event_type: state_changed
    # Alleen een echte overgang (uit -> aan, of een nieuwere versie). Na een herstart of het
    # herladen van een integratie komt de update-entiteit terug uit "unavailable"; dat negeren
    # we, anders volgt na elke herstart een melding voor alle openstaande updates.
    conditions:
      - condition: template
        value_template: >
          {% set oud = trigger.event.data.old_state %}
          {% set nieuw = trigger.event.data.new_state %}
          {{ trigger.event.data.entity_id.startswith('update.')
             and nieuw is not none and nieuw.state == 'on'
             and oud is not none and oud.state not in ['unavailable', 'unknown']
             and (oud.state != 'on'
                  or oud.attributes.latest_version != nieuw.attributes.latest_version) }}
    actions:
      # Geen variabele voor de state: die wordt dan tekst en verliest zijn attributen.
      - action: notify.mobile_app_iphone_van_stefan
        data:
          title: "⬆️ Update beschikbaar"
          message: >
            {% set nieuw = trigger.event.data.new_state %}
            {{ nieuw.attributes.title or nieuw.name }}:
            {{ nieuw.attributes.installed_version }} → {{ nieuw.attributes.latest_version }}
          data:
            url: /config/updates
