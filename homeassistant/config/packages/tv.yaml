# Tv's aan- en uitzetten.
# Een tv die uit staat is niet meer via het netwerk te bedienen; aanzetten gaat met een
# Wake-on-LAN-pakket naar het MAC-adres. Op de tv moet daarvoor aan staan:
#   LG: Instellingen > Algemeen > Apparaten > TV-beheer > "Inschakelen via Wi-Fi" (+ Quick Start+).
#   Samsung: Instellingen > Algemeen > Netwerk > Expertinstellingen > "Inschakelen met mobiel".
# Wake on LAN is per tv als integratie toegevoegd (Instellingen > Apparaten & diensten), met de
# MAC-adressen hieronder; die levert ook de actie wake_on_lan.send_magic_packet.

script:
  # Eén knop voor aan én uit (afstandsbediening). Staat de tv aan: uit. Staat hij uit of is hij
  # onbereikbaar: Wake-on-LAN (drie keer, een pakket kan verloren gaan op wifi).
  tv_lg_aan_uit:
    alias: LG tv woonkamer aan/uit
    icon: mdi:power
    mode: single
    sequence:
      - if:
          - condition: state
            entity_id: media_player.living_room_lg_webos_tv_oled65b29la
            state: ["on", "playing", "paused", "idle", "buffering"]
        then:
          - action: media_player.turn_off
            target:
              entity_id: media_player.living_room_lg_webos_tv_oled65b29la
        else:
          - repeat:
              count: 3
              sequence:
                - action: wake_on_lan.send_magic_packet
                  data:
                    mac: c8:99:b2:3a:45:8c
                    broadcast_address: 192.168.2.255
                - delay: "00:00:01"

  # Samsung op zolder: zelfde werkwijze als de LG.
  tv_samsung_aan_uit:
    alias: Samsung tv zolder aan/uit
    icon: mdi:power
    mode: single
    sequence:
      - if:
          - condition: state
            entity_id: media_player.samsung_tv_zolder
            state: ["on", "playing", "paused", "idle", "buffering"]
        then:
          - action: media_player.turn_off
            target:
              entity_id: media_player.samsung_tv_zolder
        else:
          - repeat:
              count: 3
              sequence:
                - action: wake_on_lan.send_magic_packet
                  data:
                    mac: 6c:70:cb:97:96:48
                    broadcast_address: 192.168.2.255
                - delay: "00:00:01"

  # App direct starten (knoppen "Streaming" op de afstandsbediening). Staat de tv uit: eerst aan
  # via Wake-on-LAN en wachten tot webOS klaar is (max. 30 s), dan de app openen.
  # Gebruik: script.tv_lg_start_app met data: { app: "Netflix" }  (naam zoals in de bronnenlijst)
  tv_lg_start_app:
    alias: LG tv woonkamer - app starten
    icon: mdi:application-outline
    mode: restart
    fields:
      app:
        name: App
        description: Naam van de app zoals in de bronnenlijst van de tv
        example: Netflix
        required: true
        selector:
          text:
    sequence:
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: media_player.living_room_lg_webos_tv_oled65b29la
                state: ["on", "playing", "paused", "idle", "buffering"]
        then:
          - repeat:
              count: 3
              sequence:
                - action: wake_on_lan.send_magic_packet
                  data:
                    mac: c8:99:b2:3a:45:8c
                    broadcast_address: 192.168.2.255
                - delay: "00:00:01"
          - wait_template: >
              {{ states('media_player.living_room_lg_webos_tv_oled65b29la')
                 in ['on', 'playing', 'paused', 'idle', 'buffering'] }}
            timeout: "00:00:30"
            continue_on_timeout: false
          - delay: "00:00:03" # webOS is net aan; even laten opstarten voor de app geopend wordt
      - action: media_player.select_source
        target:
          entity_id: media_player.living_room_lg_webos_tv_oled65b29la
        data:
          source: "{{ app }}"

automation:
  # Zodat ook media_player.turn_on (en de aan-knop in de mediakaart) de LG aanzet: de webOS-
  # integratie roept hiervoor deze trigger aan, omdat hij zelf geen Wake-on-LAN doet.
  - id: tv_lg_aanzetten
    alias: Tv - LG woonkamer aanzetten via Wake-on-LAN
    mode: single
    triggers:
      - trigger: webostv.turn_on
        entity_id: media_player.living_room_lg_webos_tv_oled65b29la
    actions:
      - repeat:
          count: 3
          sequence:
            - action: wake_on_lan.send_magic_packet
              data:
                mac: c8:99:b2:3a:45:8c
                broadcast_address: 192.168.2.255
            - delay: "00:00:01"

  # Idem voor de Samsung (de integratie kent het MAC-adres, maar doet zelf geen Wake-on-LAN).
  - id: tv_samsung_aanzetten
    alias: Tv - Samsung zolder aanzetten via Wake-on-LAN
    mode: single
    triggers:
      - trigger: samsungtv.turn_on
        entity_id: media_player.samsung_tv_zolder
    actions:
      - repeat:
          count: 3
          sequence:
            - action: wake_on_lan.send_magic_packet
              data:
                mac: 6c:70:cb:97:96:48
                broadcast_address: 192.168.2.255
            - delay: "00:00:01"
