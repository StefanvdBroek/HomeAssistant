# Schema's voor de airco's (woonkamer beneden en zolder). Alles op het dashboard "Airco's".
#
# Weekschema per airco: de schema-helpers schedule.airco_woonkamer en schedule.airco_zolder
# (Instellingen > Apparaten & diensten > Helpers; per dag blokken tekenen). Begin van een blok =
# airco aan met de stand/temperatuur van die airco, einde = uit. Alleen als "Weekschema actief" aan staat.
# Die helpers zijn in de interface gemaakt (niet in git); de bloktijden staan in .storage/schedule.
#
# Zondagochtend (woonkamer, om de week): "volgende keer" schuift na elke keer 14 dagen op.
#
# Daarnaast: de status van de airco's elke 5 minuten verversen.

input_boolean:
  airco_woonkamer_schema:
    name: Airco zondagochtend (om de week)
    icon: mdi:calendar-sync
  airco_woonkamer_weekschema:
    name: Weekschema actief
    icon: mdi:calendar-week
  airco_zolder_weekschema:
    name: Weekschema actief
    icon: mdi:calendar-week

input_datetime:
  airco_woonkamer_volgende:
    name: Volgende keer aan
    has_date: true
    has_time: true
    icon: mdi:calendar-clock

input_select:
  airco_woonkamer_stand:
    name: Stand
    icon: mdi:hvac
    options:
      - Verwarmen
      - Koelen
      - Automatisch
      - Drogen
      - Ventileren
  airco_zolder_stand:
    name: Stand
    icon: mdi:hvac
    options:
      - Verwarmen
      - Koelen
      - Automatisch
      - Drogen
      - Ventileren

input_number:
  airco_woonkamer_temperatuur:
    name: Temperatuur
    min: 16
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer
  airco_zolder_temperatuur:
    name: Temperatuur
    min: 16
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

script:
  # Airco aanzetten met de stand en temperatuur die voor die airco zijn ingesteld.
  airco_aanzetten:
    alias: Airco aanzetten volgens instellingen
    icon: mdi:air-conditioner
    mode: parallel
    fields:
      airco:
        name: Airco
        description: woonkamer of zolder
        required: true
        selector:
          select:
            options: [woonkamer, zolder]
      reden:
        name: Reden (voor het logboek)
        selector:
          text:
    variables:
      klimaat: >
        {{ {'woonkamer': 'climate.living_room_woonkamer_air_conditioning',
            'zolder': 'climate.zolder_zolder_air_conditioning_air_care'}[airco] }}
      stand: "{{ states('input_select.airco_' ~ airco ~ '_stand') }}"
      temperatuur: "{{ states('input_number.airco_' ~ airco ~ '_temperatuur') | float(21) }}"
    sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: "{{ klimaat }}"
        data:
          hvac_mode: >
            {{ {'Verwarmen': 'heat', 'Koelen': 'cool', 'Automatisch': 'auto',
                'Drogen': 'dry', 'Ventileren': 'fan_only'}[stand] }}
      - if:
          - condition: template # drogen en ventileren hebben geen doeltemperatuur
            value_template: "{{ stand in ['Verwarmen', 'Koelen', 'Automatisch'] }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: "{{ klimaat }}"
            data:
              temperature: "{{ temperatuur }}"
      - action: logbook.log
        data:
          name: "Airco {{ airco }}"
          message: "aangezet{{ ' (' ~ reden ~ ')' if reden is defined and reden else '' }}: {{ stand | lower }}, {{ temperatuur }} °C"

# Rekenen via de tijdstempel in lokale tijd: + 14 dagen houdt zo ook bij zomer-/wintertijd 08:00.
automation:
  - id: airco_woonkamer_schema
    alias: Airco woonkamer - om de week op zondag aan
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.airco_woonkamer_volgende
    actions:
      # Altijd eerst de volgende keer plannen (+14 dagen), ook als het schema uit staat,
      # zodat het ritme van "om de week" blijft kloppen.
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.airco_woonkamer_volgende
        data:
          datetime: >
            {{ (as_local(as_datetime(state_attr('input_datetime.airco_woonkamer_volgende', 'timestamp'))) + timedelta(days=14))
               .strftime('%Y-%m-%d %H:%M:%S') }}
      - condition: state
        entity_id: input_boolean.airco_woonkamer_schema
        state: "on"
      - action: script.airco_aanzetten
        data:
          airco: woonkamer
          reden: zondagochtend

  # Valt de volgende keer in het verleden (Home Assistant stond uit, of een datum in het verleden
  # ingesteld)? Dan doorschuiven naar de eerstvolgende keer in hetzelfde ritme.
  - id: airco_woonkamer_schema_bijwerken
    alias: Airco woonkamer - volgende keer niet in het verleden
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time
        at: "00:05:00"
    conditions:
      - condition: template
        value_template: >
          {{ as_local(as_datetime(state_attr('input_datetime.airco_woonkamer_volgende', 'timestamp'))) < now() - timedelta(minutes=5) }}
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.airco_woonkamer_volgende
        data:
          datetime: >
            {% set v = as_local(as_datetime(state_attr('input_datetime.airco_woonkamer_volgende', 'timestamp'))) %}
            {% set stappen = (((now() - v).total_seconds() / 86400 / 14) | round(0, 'ceil')) | int %}
            {{ (v + timedelta(days=14 * stappen)).strftime('%Y-%m-%d %H:%M:%S') }}

  # LG ThinQ meldt wijzigingen normaal direct, maar een aan/uit via de afstandsbediening komt
  # soms niet door: daarom elke 5 minuten zelf de status van beide airco's opvragen.
  - id: airco_status_verversen
    alias: Airco's - status elke 5 minuten verversen
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: /5
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id:
            - climate.living_room_woonkamer_air_conditioning
            - climate.zolder_zolder_air_conditioning_air_care
            - switch.living_room_woonkamer_air_conditioning_power
            - switch.zolder_zolder_air_conditioning_air_care_power
        continue_on_error: true

  # ------------------------------------------------------------- weekschema
  - id: airco_weekschema
    alias: Airco's - weekschema
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - schedule.airco_woonkamer
          - schedule.airco_zolder
        from:
          - "on"
          - "off"
        to:
          - "on"
          - "off"
    variables:
      airco: "{{ trigger.entity_id.split('.')[1].replace('airco_', '') }}"
    conditions:
      - condition: template
        value_template: "{{ is_state('input_boolean.airco_' ~ airco ~ '_weekschema', 'on') }}"
    actions:
      - if:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'on' }}"
        then:
          - action: script.airco_aanzetten
            data:
              airco: "{{ airco }}"
              reden: weekschema
        else:
          - action: climate.turn_off
            target:
              entity_id: >
                {{ {'woonkamer': 'climate.living_room_woonkamer_air_conditioning',
                    'zolder': 'climate.zolder_zolder_air_conditioning_air_care'}[airco] }}
          - action: logbook.log
            data:
              name: "Airco {{ airco }}"
              message: uitgezet (weekschema)
