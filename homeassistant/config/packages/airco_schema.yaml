# Airco's: de status actueel houden.
# Het weekschema (ook "om de week") zit in custom_components/airco_schema en op het dashboard "Airco's".

automation:
  # LG ThinQ meldt wijzigingen normaal direct, maar een aan/uit via de afstandsbediening komt
  # soms niet door: daarom elke 5 minuten zelf de status van beide airco's opvragen.
  - id: airco_status_verversen
    alias: Airco's - status elke 5 minuten verversen
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: /5
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id:
            - climate.living_room_woonkamer_air_conditioning
            - climate.zolder_zolder_air_conditioning_air_care
            - switch.living_room_woonkamer_air_conditioning_power
            - switch.zolder_zolder_air_conditioning_air_care_power
        continue_on_error: true
