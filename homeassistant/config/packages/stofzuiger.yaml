# Automatisch stofzuigprogramma voor de Roborock Q10 S5.
# Alles is in te stellen via het dashboard "Stofzuiger": aan/uit, tijd en dagen.
# De robot staat in de woonkamer en zijn kaart heeft geen kamerindeling: hij zuigt altijd de
# hele woonkamer.

input_boolean:
  stofzuig_programma_actief:
    name: Programma actief
    icon: mdi:calendar-clock
  stofzuig_ma: { name: Maandag, icon: "mdi:alpha-m-circle" }
  stofzuig_di: { name: Dinsdag, icon: "mdi:alpha-d-circle" }
  stofzuig_wo: { name: Woensdag, icon: "mdi:alpha-w-circle" }
  stofzuig_do: { name: Donderdag, icon: "mdi:alpha-d-circle" }
  stofzuig_vr: { name: Vrijdag, icon: "mdi:alpha-v-circle" }
  stofzuig_za: { name: Zaterdag, icon: "mdi:alpha-z-circle" }
  stofzuig_zo: { name: Zondag, icon: "mdi:alpha-z-circle" }

input_datetime:
  stofzuig_tijd:
    name: Starttijd
    has_date: false
    has_time: true
    icon: mdi:clock-outline

input_number:
  stofzuig_min_accu:
    name: Minimale accu
    min: 20
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-50

script:
  stofzuig_programma_uitvoeren:
    alias: Stofzuigprogramma uitvoeren
    icon: mdi:robot-vacuum
    mode: single
    sequence:
      - action: vacuum.start
        target:
          entity_id: vacuum.living_room_roborock_q10_s5
      - action: logbook.log
        data:
          name: Stofzuigprogramma
          message: gestart (woonkamer)

automation:
  - id: stofzuig_programma
    alias: Stofzuiger - automatisch programma
    description: Start de Roborock op de ingestelde tijd en dagen (dashboard Stofzuiger).
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.stofzuig_tijd
    conditions:
      - condition: state
        entity_id: input_boolean.stofzuig_programma_actief
        state: "on"
      - condition: template
        value_template: >
          {{ is_state('input_boolean.stofzuig_' ~ ['ma','di','wo','do','vr','za','zo'][now().weekday()], 'on') }}
      - condition: state
        entity_id: vacuum.living_room_roborock_q10_s5
        state: docked
      - condition: template
        value_template: >
          {{ states('sensor.living_room_roborock_q10_s5_battery') | float(0)
             >= states('input_number.stofzuig_min_accu') | float(50) }}
    actions:
      - action: script.stofzuig_programma_uitvoeren
