# Airco's: bediening en weekschema (tijdsblokken, ook om de week) per airco, plus verbruik.
# Schema: custom_components/airco_schema + www/airco-schema-card.js.
title: Airco's
views:
  - title: Airco's
    path: aircos
    icon: mdi:air-conditioner
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Woonkamer
            icon: mdi:sofa
          - type: tile
            entity: climate.living_room_woonkamer_air_conditioning
            name: Woonkamer
            state_content:
              - state
              - current_temperature
            features:
              - type: climate-hvac-modes
                hvac_modes: [heat, cool, auto, dry, fan_only, "off"]
              - type: target-temperature
            grid_options:
              columns: full
          - type: custom:airco-schema-card
            airco: woonkamer
            titel: Schema
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Zolder
            icon: mdi:home-roof
          - type: tile
            entity: climate.zolder_zolder_air_conditioning_air_care
            name: Zolder
            state_content:
              - state
              - current_temperature
            features:
              - type: climate-hvac-modes
                hvac_modes: [heat, cool, auto, dry, fan_only, "off"]
              - type: target-temperature
            grid_options:
              columns: full
          - type: custom:airco-schema-card
            airco: zolder
            titel: Schema
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Verbruik
            icon: mdi:lightning-bolt
          - type: tile
            entity: sensor.living_room_woonkamer_air_conditioning_energy_today
            name: Woonkamer vandaag
          - type: tile
            entity: sensor.zolder_zolder_air_conditioning_air_care_energy_today
            name: Zolder vandaag
          - type: tile
            entity: sensor.living_room_woonkamer_air_conditioning_energy_this_month
            name: Woonkamer maand
          - type: tile
            entity: sensor.zolder_zolder_air_conditioning_air_care_energy_this_month
            name: Zolder maand
          - type: tile
            entity: sensor.living_room_woonkamer_air_conditioning_filter_remaining
            name: Filter woonkamer
          - type: tile
            entity: sensor.zolder_zolder_air_conditioning_air_care_filter_remaining
            name: Filter zolder
