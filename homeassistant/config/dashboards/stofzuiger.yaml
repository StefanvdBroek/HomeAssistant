# Dashboard voor de Roborock Q10 S5.
# De robot staat in de woonkamer; zijn kaart heeft geen kamerindeling, dus schoonmaken = de woonkamer.
title: Stofzuiger
views:
  - title: Roborock
    path: roborock
    icon: mdi:robot-vacuum
    cards:
      - type: vertical-stack
        cards:
          - type: tile
            entity: vacuum.living_room_roborock_q10_s5
            name: Roborock
            vertical: false
            features:
              - type: vacuum-commands
                commands:
                  - start_pause
                  - stop
                  - return_home
                  - locate
          - type: glance
            show_name: true
            entities:
              - entity: sensor.living_room_roborock_q10_s5_status
                name: Status
              - entity: sensor.living_room_roborock_q10_s5_battery
                name: Accu
              - entity: sensor.living_room_roborock_q10_s5_cleaning_progress
                name: Voortgang
              - entity: sensor.living_room_roborock_q10_s5_cleaning_area
                name: Oppervlak
          - type: tile
            entity: select.living_room_roborock_q10_s5_cleaning_mode
            name: Schoonmaakmodus
            features:
              - type: select-options

      - type: button
        name: Woonkamer schoonmaken
        icon: mdi:sofa
        tap_action:
          action: perform-action
          perform_action: vacuum.start
          target:
            entity_id: vacuum.living_room_roborock_q10_s5
          confirmation:
            text: Woonkamer schoonmaken?

      - type: vertical-stack
        cards:
          - type: entities
            title: Automatisch programma
            show_header_toggle: false
            entities:
              - entity: input_boolean.stofzuig_programma_actief
              - entity: input_datetime.stofzuig_tijd
              - entity: input_number.stofzuig_min_accu
              - entity: automation.stofzuiger_automatisch_programma
                name: Laatst gestart
                secondary_info: last-triggered
                type: attribute
                attribute: last_triggered
                format: relative
          - type: grid
            title: Dagen
            columns: 7
            square: false
            cards:
              - { type: button, entity: input_boolean.stofzuig_ma, name: Ma, show_icon: false, tap_action: { action: toggle } }
              - { type: button, entity: input_boolean.stofzuig_di, name: Di, show_icon: false, tap_action: { action: toggle } }
              - { type: button, entity: input_boolean.stofzuig_wo, name: Wo, show_icon: false, tap_action: { action: toggle } }
              - { type: button, entity: input_boolean.stofzuig_do, name: Do, show_icon: false, tap_action: { action: toggle } }
              - { type: button, entity: input_boolean.stofzuig_vr, name: Vr, show_icon: false, tap_action: { action: toggle } }
              - { type: button, entity: input_boolean.stofzuig_za, name: Za, show_icon: false, tap_action: { action: toggle } }
              - { type: button, entity: input_boolean.stofzuig_zo, name: Zo, show_icon: false, tap_action: { action: toggle } }
          - type: button
            name: Programma nu uitvoeren
            icon: mdi:play-circle
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.stofzuig_programma_uitvoeren
              confirmation:
                text: Het programma nu starten met de gekozen ruimtes?

      - type: picture-entity
        entity: image.living_room_roborock_q10_s5_map
        name: Kaart
        show_state: false

      - type: entities
        title: Instellingen
        entities:
          - entity: switch.living_room_roborock_q10_s5_do_not_disturb
            name: Niet storen
          - entity: switch.living_room_roborock_q10_s5_dust_collection
            name: Automatisch legen
          - entity: switch.living_room_roborock_q10_s5_child_lock
            name: Kinderslot
          - entity: switch.living_room_roborock_q10_s5_indicator_light
            name: Indicatielampje
          - entity: number.living_room_roborock_q10_s5_volume
            name: Volume
          - entity: button.living_room_roborock_q10_s5_empty_dustbin
            name: Stofbak nu legen

      - type: entities
        title: Onderhoud (gebruikte uren — melding bij filter 150, hoofdborstel 300, zijborstel 200, sensoren 30)
        entities:
          - entity: sensor.living_room_roborock_q10_s5_main_brush_time_used
            name: Hoofdborstel
          - entity: sensor.living_room_roborock_q10_s5_side_brush_time_used
            name: Zijborstel
          - entity: sensor.living_room_roborock_q10_s5_filter_time_used
            name: Filter
          - entity: sensor.living_room_roborock_q10_s5_sensor_time_used
            name: Sensoren
          - type: divider
          - entity: counter.stofzak_leegbeurten
            name: Leegbeurten sinds nieuwe stofzak (melding bij 30)
          - type: button
            name: Stofzak vervangen
            icon: mdi:delete-restore
            action_name: Op nul zetten
            tap_action:
              action: perform-action
              perform_action: counter.reset
              target:
                entity_id: counter.stofzak_leegbeurten
              confirmation:
                text: Stofzak vervangen? De teller gaat terug naar 0.

      - type: entities
        title: Totalen
        entities:
          - entity: sensor.living_room_roborock_q10_s5_total_cleaning_count
            name: Aantal schoonmaakbeurten
          - entity: sensor.living_room_roborock_q10_s5_total_cleaning_area
            name: Totaal oppervlak
          - entity: sensor.living_room_roborock_q10_s5_total_cleaning_time
            name: Totale tijd
