# Klantkaarten: barcodes en foto's om bij de kassa te laten scannen.
# Toevoegen gaat via de app (takenlijst "Klantkaarten" of Media > klantkaarten);
# zie packages/klantkaarten.yaml.
title: Klantkaarten
views:
  - title: Klantkaarten
    path: kaarten
    icon: mdi:wallet-membership
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Klantkaarten
            icon: mdi:wallet-membership
            badges:
              - type: entity
                entity: sensor.klantkaarten
                show_icon: false
                show_state: true
          - type: button
            name: Kaart toevoegen
            icon: mdi:card-plus
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /todo?entity_id=todo.klantkaarten
            grid_options:
              columns: 4
              rows: 1
          - type: button
            name: Foto uploaden
            icon: mdi:camera-plus
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /media-browser/browser/app%2Cmedia-source%3A%2F%2Fmedia_source/%2Cmedia-source%3A%2F%2Fmedia_source%2Flocal%2Fklantkaarten
            grid_options:
              columns: 4
              rows: 1
          - type: button
            name: Vernieuwen
            icon: mdi:refresh
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.klantkaarten_bijwerken
            grid_options:
              columns: 4
              rows: 1

      - type: grid
        column_span: 2
        cards:
          - type: markdown
            grid_options:
              columns: full
            content: >
              {% set kaarten = state_attr('sensor.klantkaarten', 'kaarten') or [] %}
              {% for k in kaarten %}
              ## {{ k.naam }}

              {% if k.barcode %}<img src="{{ k.barcode }}" width="{{ '60%' if k.soort == 'QR-code' else '100%' }}">{% endif %}

              {% if k.foto %}<img src="{{ k.foto }}" width="100%">{% endif %}

              {% if k.melding %}<font color="#d97706">⚠️ {{ k.melding }}</font>{% endif %}
              {% if k.soort %}<font color="#888888">{{ k.soort }}</font>{% endif %}

              {% if not loop.last %}<hr>{% endif %}
              {% else %}
              Nog geen klantkaarten.

              **Kaart toevoegen:** tik op *Kaart toevoegen*, zet de **winkel** als titel en het
              **kaartnummer** in de beschrijving. Voor een QR-code: begin de beschrijving met `qr:`.

              **Foto uploaden:** tik op *Foto uploaden* en upload een foto of screenshot van de
              kaart. De bestandsnaam wordt de naam van de kaart.
              {% endfor %}
