# Verlichting: bediening en schema's per lamp.
title: Verlichting
views:
  - title: Lampen
    path: lampen
    icon: mdi:lightbulb-group
    cards:
      - type: vertical-stack
        cards:
          - type: tile
            entity: light.lamp_voordeur
            name: Lamp voordeur
            features:
              - type: light-brightness
              - type: light-color-temp
          - type: grid
            title: Kleur
            columns: 3
            square: false
            cards:
              - type: button
                name: Warm wit
                icon: "mdi:white-balance-incandescent"
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: light.turn_on
                  target:
                    entity_id: light.lamp_voordeur
                  data:
                    color_temp_kelvin: 2700
              - type: button
                name: Daglicht
                icon: "mdi:white-balance-sunny"
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: light.turn_on
                  target:
                    entity_id: light.lamp_voordeur
                  data:
                    color_temp_kelvin: 5000
              - type: button
                name: Rood
                icon: "mdi:circle"
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: light.turn_on
                  target:
                    entity_id: light.lamp_voordeur
                  data:
                    rgb_color: [255, 0, 0]
              - type: button
                name: Oranje
                icon: "mdi:circle"
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: light.turn_on
                  target:
                    entity_id: light.lamp_voordeur
                  data:
                    rgb_color: [255, 120, 0]
              - type: button
                name: Geel
                icon: "mdi:circle"
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: light.turn_on
                  target:
                    entity_id: light.lamp_voordeur
                  data:
                    rgb_color: [255, 220, 0]
              - type: button
                name: Groen
                icon: "mdi:circle"
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: light.turn_on
                  target:
                    entity_id: light.lamp_voordeur
                  data:
                    rgb_color: [0, 220, 60]
              - type: button
                name: Blauw
                icon: "mdi:circle"
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: light.turn_on
                  target:
                    entity_id: light.lamp_voordeur
                  data:
                    rgb_color: [0, 80, 255]
              - type: button
                name: Paars
                icon: "mdi:circle"
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: light.turn_on
                  target:
                    entity_id: light.lamp_voordeur
                  data:
                    rgb_color: [150, 0, 255]
              - type: button
                name: Roze
                icon: "mdi:circle"
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: light.turn_on
                  target:
                    entity_id: light.lamp_voordeur
                  data:
                    rgb_color: [255, 60, 160]
              - type: button
                name: Kleurenwiel
                icon: mdi:palette
                show_state: false
                tap_action:
                  action: more-info
                entity: light.lamp_voordeur
          - type: entities
            title: Schema lamp voordeur
            show_header_toggle: false
            entities:
              - entity: input_boolean.lamp_voordeur_schema_actief
              - entity: input_boolean.lamp_voordeur_aan_bij_zonsondergang
              - entity: input_number.lamp_voordeur_zonsondergang_offset
              - entity: sensor.lamp_voordeur_aan_bij_zonsondergang
                name: Gaat vandaag aan om
                format: time
              - entity: input_datetime.lamp_voordeur_aan_tijd
              - entity: input_datetime.lamp_voordeur_uit_tijd
              - type: divider
              - entity: input_number.lamp_voordeur_helderheid
              - entity: input_number.lamp_voordeur_kleurtemperatuur
