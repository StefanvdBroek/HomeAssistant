# Afstandsbediening voor de LG OLED65B29LA in de woonkamer.
# Gegenereerd; pas gerust aan. Knoppen: https://www.home-assistant.io/integrations/webostv/#actions
title: Afstandsbediening
views:
  - title: Woonkamer-tv
    path: tv
    icon: mdi:remote-tv
    cards:
      - type: vertical-stack
        cards:
          - type: media-control
            entity: media_player.living_room_lg_webos_tv_oled65b29la
          - type: grid
            columns: 3
            square: false
            cards:
              - type: button
                name: Uit
                icon: mdi:power
                tap_action:
                  action: perform-action
                  perform_action: media_player.turn_off
                  target:
                    entity_id: media_player.living_room_lg_webos_tv_oled65b29la
              - type: button
                name: Dempen
                icon: mdi:volume-mute
                tap_action:
                  action: perform-action
                  perform_action: webostv.button
                  target:
                    entity_id: media_player.living_room_lg_webos_tv_oled65b29la
                  data:
                    button: MUTE
              - type: button
                name: Instellingen
                icon: mdi:cog
                tap_action:
                  action: perform-action
                  perform_action: webostv.button
                  target:
                    entity_id: media_player.living_room_lg_webos_tv_oled65b29la
