# Server: de Home Assistant-VM (System Monitor + Supervisor) en Proxmox.
# Alleen voor Stefan: dashboard alleen voor beheerders, weergave alleen voor deze gebruiker.
# Meldingen: packages/server.yaml. Bereikbaarheid: Uptime Kuma (http://192.168.2.43:3001).
title: Server
views:
  - title: Server
    path: server
    icon: mdi:server
    type: sections
    max_columns: 3
    visible:
      - user: d50ef6680816427b8db92f5f48da876a # Stefan
    badges:
      - type: entity
        entity: update.home_assistant_core_update
        name: Home Assistant
        show_name: true
        state_content: [installed_version]
      - type: entity
        entity: sensor.home_assistant_operating_system_version
        name: HAOS
        show_name: true
      - type: entity
        entity: sensor.system_monitor_uptime
        name: VM gestart
        show_name: true
    sections:
      # ------------------------------------------------------- servers
      # Overzicht van alles wat draait. Gegevens van de Proxmox VE-integratie (API-token
      # homeassistant@pve!ha, alleen lezen). Modem en Deco staan in het blok Netwerk.
      # Geheugen van de HA-VM komt van System Monitor: Proxmox telt de cache van de VM mee
      # en toont daardoor altijd ~100%.
      # Kaart: www/server-overzicht-card.js (dashboard-bron /local/server-overzicht-card.js).
      - type: grid
        column_span: 3
        cards:
          - type: custom:server-overzicht-card
            titel: Servers
            servers:
              - naam: Proxmox
                soort: Host
                icoon: mdi:server
                status: sensor.pve_status
                cpu: sensor.pve_cpu_usage
                geheugen: sensor.pve_memory_usage_percentage
                schijf: sensor.storage_local_storage_usage_percentage
                sinds: sensor.pve_uptime
                url: https://192.168.2.23
              - naam: Home Assistant
                soort: VM 100
                icoon: mdi:home-assistant
                status: sensor.homeassistant_status
                cpu: sensor.homeassistant_cpu_usage
                geheugen: sensor.system_monitor_memory_usage
                schijf: sensor.system_monitor_disk_usage_config
                sinds: sensor.system_monitor_uptime
              - naam: Docker
                soort: VM 103 · Portainer
                icoon: mdi:docker
                status: sensor.docker_status
                cpu: sensor.docker_vm_cpu # Glances, van binnenuit
                geheugen: sensor.docker_vm_geheugen
                schijf: sensor.docker_vm_schijf
                sinds: sensor.docker_vm_aan_sinds
                url: https://192.168.2.43:9443

      # -------------------------------------------------------- netwerk
      # Netwerkapparaten: alleen bereikbaarheid (Ping-integratie, elke 30 s). Zelfde kaart als
      # Servers; zonder CPU/geheugen/schijf toont hij alleen status en sinds wanneer.
      - type: grid
        column_span: 3
        cards:
          - type: custom:server-overzicht-card
            titel: Netwerk
            kolom: Apparaat
            servers:
              - naam: KPN-modem
                soort: 192.168.2.254
                icoon: mdi:router-network
                status: binary_sensor.server_kpn_modem
                url: http://192.168.2.254
              - naam: Deco (hal)
                soort: 192.168.2.25
                icoon: mdi:router-wireless
                status: binary_sensor.server_deco

      # ----------------------------------------------------- server one
      # De hele pc (Proxmox-host): per gast wat hij van de host gebruikt; de rest is Proxmox zelf.
      # Geheugen zoals de host het ziet (incl. cache van de VM), schijf = beide opslagen op de SSD.
      - type: grid
        column_span: 3
        cards:
          - type: custom:pc-totaal-card
            titel: Server One
            host:
              naam: Proxmox zelf
              cpu: sensor.pve_cpu_usage
              kernen: sensor.pve_max_cpu
              geheugen: sensor.pve_memory_usage
              geheugen_totaal: sensor.pve_max_memory_usage
              schijf: sensor.storage_local_used_storage
              schijf_totaal:
                - sensor.storage_local_total_storage
                - sensor.storage_local_lvm_total_storage
            gasten:
              - naam: Home Assistant
                cpu: sensor.homeassistant_cpu_usage
                kernen: sensor.homeassistant_max_cpu
                geheugen: sensor.homeassistant_memory_usage
                schijf: sensor.home_assistant_schijf_op_host
              - naam: Docker
                cpu: sensor.docker_cpu_usage
                kernen: sensor.docker_max_cpu
                geheugen: sensor.docker_memory_usage
                schijf: sensor.docker_vm_schijf_gebruikt

      # ----------------------------------------------------- containers
      # Docker-containers op de Docker-VM, automatisch gevonden via de Portainer-integratie
      # (https://192.168.2.43:9443, API-token). Nieuwe containers verschijnen vanzelf.
      - type: grid
        column_span: 3
        cards:
          - type: custom:container-overzicht-card
            titel: Containers

      # ------------------------------------------------------ bewaking
      # Monitors van Uptime Kuma (integratie uptime_kuma, Docker-VM). Kaart in hetzelfde bestand.
      - type: grid
        column_span: 3
        cards:
          - type: custom:uptime-overzicht-card
            titel: Bewaking (Uptime Kuma)
            url: http://192.168.2.43:3001
            monitors:
              - naam: Thuis online
                id: thuis_online_healthcecks_io
                icoon: mdi:home-heart
              - naam: Internet
                id: internet
                icoon: mdi:web
              - naam: Home Assistant
                id: home_assistance
                icoon: mdi:home-assistant
              - naam: Proxmox
                id: proxmox
                icoon: mdi:server
              - naam: Deco
                id: deco
                icoon: mdi:router-wireless
              - naam: Docker-VM
                id: docker_vm
                icoon: mdi:docker
              - naam: Portainer
                id: portainer
                icoon: mdi:view-dashboard-outline
              - naam: Adchieve production
                id: adchieve_production
                icoon: mdi:briefcase-outline

      # ------------------------------------------------- per server
      # Inklapbaar: tik op de kop. De stand staat in input_boolean.server_grafieken_tonen
      # (packages/server.yaml); de serverblokken hieronder zijn alleen zichtbaar als die aan staat.
      - type: grid
        column_span: 3
        cards:
          - type: custom:inklap-kop-card
            titel: Grafieken per server
            schakelaar: input_boolean.server_grafieken_tonen
            status:
              - sensor.pve_status
              - sensor.homeassistant_status
              - sensor.docker_status

      # ------------------------------------------------------ proxmox
      - type: grid
        visibility: &grafieken_open
          - condition: state
            entity: input_boolean.server_grafieken_tonen
            state: "on"
        cards:
          - type: heading
            heading: Proxmox · Host
            icon: mdi:server
            badges:
              - type: entity
                entity: sensor.pve_status
          - &meter_cpu
            type: gauge
            entity: sensor.pve_cpu_usage
            name: CPU
            min: 0
            max: 100
            needle: true
            severity: { green: 0, yellow: 70, red: 90 }
            grid_options: { columns: 4 }
          - &meter_geheugen
            type: gauge
            entity: sensor.pve_memory_usage_percentage
            name: Geheugen
            min: 0
            max: 100
            needle: true
            severity: { green: 0, yellow: 80, red: 90 }
            grid_options: { columns: 4 }
          - &meter_schijf
            type: gauge
            entity: sensor.storage_local_storage_usage_percentage # systeem + back-ups (local)
            name: Schijf
            min: 0
            max: 100
            needle: true
            severity: { green: 0, yellow: 70, red: 85 }
            grid_options: { columns: 4 }
          - &tegel_sinds
            type: tile
            entity: sensor.pve_uptime
            name: Aan sinds
            icon: mdi:power
            vertical: true
            grid_options: { columns: 4 }
          - &tegel_vrij
            type: tile
            entity: sensor.storage_local_available_storage
            name: Schijf vrij
            icon: mdi:harddisk
            vertical: true
            grid_options: { columns: 4 }
          - &tegel_backup
            type: tile
            entity: sensor.pve_last_backup # wekelijkse back-up van VM 100 en VM 103
            name: Laatste back-up
            icon: mdi:backup-restore
            vertical: true
            grid_options: { columns: 4 }
          - &grafiek
            type: history-graph
            hours_to_show: 24
            grid_options: { columns: full }
            entities:
              - entity: sensor.pve_cpu_usage
                name: CPU
              - entity: sensor.pve_memory_usage_percentage
                name: Geheugen

      # ----------------------------------------------- home assistant
      # Geheugen en schijf via System Monitor (binnen de VM): Proxmox telt de cache van de VM mee.
      - type: grid
        visibility: *grafieken_open
        cards:
          - type: heading
            heading: Home Assistant · VM 100
            icon: mdi:home-assistant
            badges:
              - type: entity
                entity: sensor.homeassistant_status
          - <<: *meter_cpu
            entity: sensor.system_monitor_processor_use
          - <<: *meter_geheugen
            entity: sensor.system_monitor_memory_usage
          - <<: *meter_schijf
            entity: sensor.system_monitor_disk_usage_config
          - <<: *tegel_sinds
            entity: sensor.system_monitor_uptime
          - <<: *tegel_vrij
            entity: sensor.home_assistant_host_disk_free
          - <<: *tegel_backup
            entity: sensor.backup_last_successful_automatic_backup # elke nacht, lokaal + Google Drive
          - <<: *grafiek
            entities:
              - entity: sensor.system_monitor_processor_use
                name: CPU
              - entity: sensor.system_monitor_memory_usage
                name: Geheugen

      # --------------------------------------------------------- docker
      # VM 103 (Debian 13 + Docker + Portainer). Cijfers van Glances (van binnenuit), net als
      # System Monitor bij Home Assistant. Zit in de wekelijkse Proxmox-back-up.
      - type: grid
        visibility: *grafieken_open
        cards:
          - type: heading
            heading: Docker · VM 103
            icon: mdi:docker
            badges:
              - type: entity
                entity: sensor.docker_status
              - type: entity
                entity: sensor.docker_vm_containers
                name: Containers
                show_name: true
          - <<: *meter_cpu
            entity: sensor.docker_vm_cpu
          - <<: *meter_geheugen
            entity: sensor.docker_vm_geheugen
          - <<: *meter_schijf
            entity: sensor.docker_vm_schijf
          - <<: *tegel_sinds
            entity: sensor.docker_vm_aan_sinds
          - <<: *tegel_vrij
            entity: sensor.docker_vm_schijf_vrij
          - <<: *tegel_backup
            entity: sensor.pve_last_backup # wekelijkse back-up van VM 100 en VM 103
          - <<: *grafiek
            entities:
              - entity: sensor.docker_vm_cpu
                name: CPU
              - entity: sensor.docker_vm_geheugen
                name: Geheugen

      # ------------------------------------------------------ add-ons
      - type: grid
        cards:
          - type: heading
            heading: Add-ons en updates
            icon: mdi:puzzle
          - type: tile
            entity: binary_sensor.tailscale_running
            name: Tailscale
            icon: mdi:vpn
          - type: tile
            entity: update.home_assistant_core_update
            name: Home Assistant
          - type: tile
            entity: update.home_assistant_operating_system_update
            name: HAOS
