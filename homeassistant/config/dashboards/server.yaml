# Server: de Home Assistant-VM (System Monitor + Supervisor) en Proxmox.
# Alleen voor Stefan: dashboard alleen voor beheerders, weergave alleen voor deze gebruiker.
# Meldingen: packages/server.yaml. Bereikbaarheid: Uptime Kuma (http://uptime-kuma.home).
title: Server
views:
  - title: Server
    path: server
    icon: mdi:server
    type: sections
    max_columns: 3
    visible:
      - user: d50ef6680816427b8db92f5f48da876a # Stefan
    badges:
      - type: entity
        entity: update.home_assistant_core_update
        name: Home Assistant
        show_name: true
        state_content: [installed_version]
      - type: entity
        entity: sensor.home_assistant_operating_system_version
        name: HAOS
        show_name: true
      - type: entity
        entity: sensor.system_monitor_uptime
        name: VM gestart
        show_name: true
    sections:
      # ------------------------------------------------------- servers
      # Overzicht van alles wat draait. Gegevens van de Proxmox VE-integratie (API-token
      # homeassistant@pve!ha, alleen lezen); modem en Deco via de Ping-integratie.
      # Geheugen van de HA-VM komt van System Monitor: Proxmox telt de cache van de VM mee
      # en toont daardoor altijd ~100%.
      # Kaart: www/server-overzicht-card.js (dashboard-bron /local/server-overzicht-card.js).
      - type: grid
        column_span: 3
        cards:
          - type: custom:server-overzicht-card
            titel: Servers
            servers:
              - naam: Proxmox
                soort: Host
                icoon: mdi:server
                status: sensor.pve_status
                cpu: sensor.pve_cpu_usage
                geheugen: sensor.pve_memory_usage_percentage
                schijf: sensor.storage_local_storage_usage_percentage
                sinds: sensor.pve_uptime
                url: https://192.168.2.23
              - naam: Home Assistant
                soort: VM 100
                icoon: mdi:home-assistant
                status: sensor.homeassistant_status
                cpu: sensor.homeassistant_cpu_usage
                geheugen: sensor.system_monitor_memory_usage
                schijf: sensor.system_monitor_disk_usage_config
                sinds: sensor.system_monitor_uptime
              - naam: Uptime Kuma
                soort: LXC 101
                icoon: mdi:heart-pulse
                status: sensor.uptime_kuma_status
                cpu: sensor.uptime_kuma_cpu_usage
                geheugen: sensor.uptime_kuma_memory_usage_percentage
                schijf_gebruikt: sensor.uptime_kuma_disk_usage
                schijf_max: sensor.uptime_kuma_max_disk_usage
                sinds: sensor.uptime_kuma_uptime
                url: http://uptime-kuma.home
              - naam: Playground
                soort: LXC 102
                icoon: mdi:flask-outline
                status: sensor.playground_status
                cpu: sensor.playground_cpu_usage
                geheugen: sensor.playground_memory_usage_percentage
                schijf_gebruikt: sensor.playground_disk_usage
                schijf_max: sensor.playground_max_disk_usage
                sinds: sensor.playground_uptime
                url: http://192.168.2.230
              - naam: KPN-modem
                soort: 192.168.2.254
                icoon: mdi:router-network
                status: binary_sensor.server_kpn_modem
                url: http://192.168.2.254
              - naam: Deco (hal)
                soort: 192.168.2.25
                icoon: mdi:router-wireless
                status: binary_sensor.server_deco

      # ------------------------------------------------- mini-pc totaal
      # De hele pc (Proxmox-host): per gast wat hij van de host gebruikt; de rest is Proxmox zelf.
      # Geheugen zoals de host het ziet (incl. cache van de VM), schijf = beide opslagen op de SSD.
      - type: grid
        column_span: 3
        cards:
          - type: custom:pc-totaal-card
            titel: Mini-pc totaal
            host:
              naam: Proxmox zelf
              cpu: sensor.pve_cpu_usage
              kernen: sensor.pve_max_cpu
              geheugen: sensor.pve_memory_usage
              geheugen_totaal: sensor.pve_max_memory_usage
              schijf: sensor.storage_local_used_storage
              schijf_totaal:
                - sensor.storage_local_total_storage
                - sensor.storage_local_lvm_total_storage
            gasten:
              - naam: Home Assistant
                cpu: sensor.homeassistant_cpu_usage
                kernen: sensor.homeassistant_max_cpu
                geheugen: sensor.homeassistant_memory_usage
                schijf: sensor.home_assistant_schijf_op_host
              - naam: Uptime Kuma
                cpu: sensor.uptime_kuma_cpu_usage
                kernen: sensor.uptime_kuma_max_cpu
                geheugen: sensor.uptime_kuma_memory_usage
                schijf: sensor.uptime_kuma_disk_usage
              - naam: Playground
                cpu: sensor.playground_cpu_usage
                kernen: sensor.playground_max_cpu
                geheugen: sensor.playground_memory_usage
                schijf: sensor.playground_disk_usage

      # ------------------------------------------------------ bewaking
      # Monitors van Uptime Kuma (integratie uptime_kuma, LXC 101). Kaart in hetzelfde bestand.
      - type: grid
        column_span: 3
        cards:
          - type: custom:uptime-overzicht-card
            titel: Bewaking (Uptime Kuma)
            url: http://uptime-kuma.home
            monitors:
              - naam: Thuis online
                id: thuis_online_healthcecks_io
                icoon: mdi:home-heart
              - naam: Internet
                id: internet
                icoon: mdi:web
              - naam: Home Assistant
                id: home_assistance
                icoon: mdi:home-assistant
              - naam: Proxmox
                id: proxmox
                icoon: mdi:server
              - naam: Deco
                id: deco
                icoon: mdi:router-wireless
              - naam: Adchieve production
                id: adchieve_production
                icoon: mdi:briefcase-outline

      # ------------------------------------------------- per server
      # Elke server met grafieken volgt hetzelfde sjabloon (zelfde volgorde, namen en grenzen als
      # de balkjes in de kaart Servers): kop "Naam · soort" met status, meters CPU/Geheugen/Schijf,
      # tegels Aan sinds/Schijf vrij/Laatste back-up, grafiek CPU + geheugen (24 uur).
      # Grenzen: CPU 70/90 %, geheugen 80/90 %, schijf 70/85 % (oranje/rood).

      # ------------------------------------------------------ proxmox
      - type: grid
        cards:
          - type: heading
            heading: Proxmox · Host
            icon: mdi:server
            badges:
              - type: entity
                entity: sensor.pve_status
          - &meter_cpu
            type: gauge
            entity: sensor.pve_cpu_usage
            name: CPU
            min: 0
            max: 100
            needle: true
            severity: { green: 0, yellow: 70, red: 90 }
            grid_options: { columns: 4 }
          - &meter_geheugen
            type: gauge
            entity: sensor.pve_memory_usage_percentage
            name: Geheugen
            min: 0
            max: 100
            needle: true
            severity: { green: 0, yellow: 80, red: 90 }
            grid_options: { columns: 4 }
          - &meter_schijf
            type: gauge
            entity: sensor.storage_local_storage_usage_percentage # systeem + back-ups (local)
            name: Schijf
            min: 0
            max: 100
            needle: true
            severity: { green: 0, yellow: 70, red: 85 }
            grid_options: { columns: 4 }
          - &tegel_sinds
            type: tile
            entity: sensor.pve_uptime
            name: Aan sinds
            icon: mdi:power
            vertical: true
            grid_options: { columns: 4 }
          - &tegel_vrij
            type: tile
            entity: sensor.storage_local_available_storage
            name: Schijf vrij
            icon: mdi:harddisk
            vertical: true
            grid_options: { columns: 4 }
          - &tegel_backup
            type: tile
            entity: sensor.pve_last_backup # wekelijkse back-up van VM 100 en LXC 101
            name: Laatste back-up
            icon: mdi:backup-restore
            vertical: true
            grid_options: { columns: 4 }
          - &grafiek
            type: history-graph
            hours_to_show: 24
            grid_options: { columns: full }
            entities:
              - entity: sensor.pve_cpu_usage
                name: CPU
              - entity: sensor.pve_memory_usage_percentage
                name: Geheugen

      # ----------------------------------------------- home assistant
      # Geheugen en schijf via System Monitor (binnen de VM): Proxmox telt de cache van de VM mee.
      - type: grid
        cards:
          - type: heading
            heading: Home Assistant · VM 100
            icon: mdi:home-assistant
            badges:
              - type: entity
                entity: sensor.homeassistant_status
          - <<: *meter_cpu
            entity: sensor.system_monitor_processor_use
          - <<: *meter_geheugen
            entity: sensor.system_monitor_memory_usage
          - <<: *meter_schijf
            entity: sensor.system_monitor_disk_usage_config
          - <<: *tegel_sinds
            entity: sensor.system_monitor_uptime
          - <<: *tegel_vrij
            entity: sensor.home_assistant_host_disk_free
          - <<: *tegel_backup
            entity: sensor.backup_last_successful_automatic_backup # elke nacht, lokaal + Google Drive
          - <<: *grafiek
            entities:
              - entity: sensor.system_monitor_processor_use
                name: CPU
              - entity: sensor.system_monitor_memory_usage
                name: Geheugen

      # -------------------------------------------------- uptime kuma
      # LXC: Proxmox ziet hier alles van binnenuit (CPU, geheugen, schijf). Schijf-% en vrij via
      # template-sensoren in packages/server.yaml. Zit in de wekelijkse Proxmox-back-up.
      - type: grid
        cards:
          - type: heading
            heading: Uptime Kuma · LXC 101
            icon: mdi:heart-pulse
            badges:
              - type: entity
                entity: sensor.uptime_kuma_status
          - <<: *meter_cpu
            entity: sensor.uptime_kuma_cpu_usage
          - <<: *meter_geheugen
            entity: sensor.uptime_kuma_memory_usage_percentage
          - <<: *meter_schijf
            entity: sensor.uptime_kuma_schijf
          - <<: *tegel_sinds
            entity: sensor.uptime_kuma_uptime
          - <<: *tegel_vrij
            entity: sensor.uptime_kuma_schijf_vrij
          - <<: *tegel_backup
            entity: sensor.pve_last_backup # wekelijkse back-up van VM 100 en LXC 101
          - <<: *grafiek
            entities:
              - entity: sensor.uptime_kuma_cpu_usage
                name: CPU
              - entity: sensor.uptime_kuma_memory_usage_percentage
                name: Geheugen

      # --------------------------------------------------- playground
      # LXC 102 (PlaygroundAdmin). Zit niet in de wekelijkse back-up: de tegel toont dat.
      - type: grid
        cards:
          - type: heading
            heading: Playground · LXC 102
            icon: mdi:flask-outline
            badges:
              - type: entity
                entity: sensor.playground_status
          - <<: *meter_cpu
            entity: sensor.playground_cpu_usage
          - <<: *meter_geheugen
            entity: sensor.playground_memory_usage_percentage
          - <<: *meter_schijf
            entity: sensor.playground_schijf
          - <<: *tegel_sinds
            entity: sensor.playground_uptime
          - <<: *tegel_vrij
            entity: sensor.playground_schijf_vrij
          - <<: *tegel_backup
            entity: sensor.playground_laatste_back_up
          - <<: *grafiek
            entities:
              - entity: sensor.playground_cpu_usage
                name: CPU
              - entity: sensor.playground_memory_usage_percentage
                name: Geheugen

      # ------------------------------------------------------ add-ons
      - type: grid
        cards:
          - type: heading
            heading: Add-ons en updates
            icon: mdi:puzzle
          - type: tile
            entity: binary_sensor.go2rtc_running
            name: go2rtc (deurbelbeeld)
            icon: mdi:video
          - type: tile
            entity: binary_sensor.tailscale_running
            name: Tailscale
            icon: mdi:vpn
          - type: tile
            entity: update.home_assistant_core_update
            name: Home Assistant
          - type: tile
            entity: update.home_assistant_operating_system_update
            name: HAOS
