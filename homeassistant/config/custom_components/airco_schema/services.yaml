blok_opslaan:
  name: Tijdsblok opslaan
  description: Tijdsblok toevoegen of (met id) wijzigen.
  fields:
    airco: { name: Airco, required: true, example: woonkamer, selector: { text: } }
    id: { name: Id (alleen bij wijzigen), selector: { text: } }
    dagen: { name: Dagen (0 = maandag … 6 = zondag), required: true, example: "[0, 1, 2, 3, 4]", selector: { object: } }
    begin: { name: Begintijd, required: true, example: "07:00", selector: { text: } }
    eind: { name: Eindtijd, required: true, example: "09:00", selector: { text: } }
    modus: { name: Modus, required: true, selector: { select: { options: [heat, cool, auto, dry, fan_only] } } }
    temperatuur: { name: Temperatuur, selector: { number: { min: 7, max: 35, step: 0.5 } } }
    ventilator: { name: Ventilatorstand, example: auto, selector: { text: } }
    actief: { name: Actief, selector: { boolean: } }

blok_verwijderen:
  name: Tijdsblok verwijderen
  fields:
    airco: { name: Airco, required: true, selector: { text: } }
    id: { name: Id, required: true, selector: { text: } }

aan_uit:
  name: Schema aan of uit
  fields:
    airco: { name: Airco, required: true, selector: { text: } }
    aan: { name: Aan, required: true, selector: { boolean: } }
